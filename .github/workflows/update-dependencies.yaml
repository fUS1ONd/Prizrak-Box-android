name: Update Moshen Core and Go Modules
on:
  workflow_dispatch:
    inputs:
      moshen_version:
        description: 'Тег ядра fUS1ONd/moshen (например v1.19.29-fs.1). Пусто — возьмётся последний релиз.'
        required: false
        default: ''

env:
  # Репозиторий ядра — задаётся в одном месте, дальше подставляется везде.
  CORE_REPO: fUS1ONd/moshen

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve moshen version
        id: resolve
        run: |
          INPUT="${{ inputs.moshen_version }}"
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -sf "https://api.github.com/repos/${{ env.CORE_REPO }}/releases/latest" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r '.tag_name')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "У ${{ env.CORE_REPO }} нет ни одного релиза — укажи тег вручную." >&2
              exit 1
            fi
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      # Шаблон замены намеренно не привязан к текущему владельцу модуля: в go.mod
      # может стоять и апстримный legiz-ru/moshen (сразу после синка с апстримом),
      # и наш форк. Матчим строку replace целиком по левой части.
      - name: Pin new moshen version in go.mod files
        run: |
          NEW_VERSION="${{ steps.resolve.outputs.version }}"
          sed -i -E "s|^replace github.com/metacubex/mihomo => .*|replace github.com/metacubex/mihomo => github.com/${{ env.CORE_REPO }} $NEW_VERSION|" \
            core/src/foss/golang/go.mod \
            core/src/main/golang/go.mod
          echo "Ядро запинено на $NEW_VERSION"
          grep "replace github.com/metacubex/mihomo" core/src/foss/golang/go.mod
          grep "replace github.com/metacubex/mihomo" core/src/main/golang/go.mod

      - name: Update Foss Gomod
        run: |
          cd ${{ github.workspace }}/core/src/foss/golang/
          go mod tidy

      - name: Update Main Gomod
        run: |
          cd ${{ github.workspace }}/core/src/main/golang/
          go mod tidy

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update moshen to ${{ steps.resolve.outputs.version }}"
          branch: update-dependencies
          delete-branch: true
          title: "Update moshen to ${{ steps.resolve.outputs.version }}"
          draft: false
          body: |
            - Ядро (`${{ env.CORE_REPO }}`) → `${{ steps.resolve.outputs.version }}`
            - Обновлены зависимости Go-модулей (`go mod tidy`)
          labels: |
            Update

      - name: PR result
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
